# RepoTales — Nginx (container only)
#
# Serves the Vite production bundle on 5173 and proxies /api/* to the backend
# container. `proxy_pass .../` with the trailing slash strips the /api prefix:
# the FastAPI app mounts its routers at /saga and /image-proxy, not /api/saga.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Manga panels are 384px images and sagas can be large; do not truncate.
    client_max_body_size 8m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # API + image proxy. FLUX generation can take up to AMD_IMAGE_TIMEOUT
    # (120 s by default), so the read timeout is generous.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
